<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex, nofollow" />
  <title>Admin Login</title>
  <link rel="icon" type="image/svg+xml" href="../assets/favicon.svg" />
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            accent: { DEFAULT: '#8B5CF6', hover: '#7C3AED' },
          },
        },
      },
    };
  </script>
  <link rel="stylesheet" href="css/admin.css" />
  <style>
    .login-card {
      animation: fadeIn 0.4s ease-out;
    }
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(8px); }
      to { opacity: 1; transform: translateY(0); }
    }
  </style>
</head>
<body style="background: var(--bg);" class="min-h-screen flex items-center justify-center p-4">
  <div class="w-full max-w-sm login-card">
    <div style="background: var(--card); border: 1px solid var(--border);" class="rounded-xl shadow-lg p-8">
      <div class="text-center mb-6">
        <img src="../assets/logo.svg" alt="Logo" class="h-8 mx-auto mb-3" />
        <h1 class="text-xl font-bold" style="color: var(--text);">Admin Login</h1>
        <p class="text-sm mt-1" style="color: var(--text-muted);">Enter your password to continue.</p>
      </div>

      <form id="login-form" novalidate>
        <div class="mb-4">
          <label for="password" class="block text-sm font-medium mb-1.5" style="color: var(--text);">Password</label>
          <input
            type="password"
            id="password"
            class="w-full px-4 py-2.5 rounded-lg text-sm outline-none transition-all"
            style="background: var(--input-bg, #1e1e28); border: 1.5px solid var(--border); color: var(--text);"
            placeholder="Enter admin password"
            required
            autocomplete="current-password"
          />
        </div>

        <div id="error-message" class="hidden mb-4 p-3 rounded-lg text-sm" style="background: rgba(239,68,68,0.15); border: 1px solid rgba(239,68,68,0.3); color: #f87171;"></div>

        <button type="submit" id="login-btn" class="w-full py-2.5 font-semibold rounded-lg text-sm transition-colors" style="background: var(--accent); color: white;">
          Sign In
        </button>
      </form>
    </div>
  </div>

  <script src="../config.js"></script>
  <script type="module" src="js/login.js"></script>
</body>
</html>
