<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex, nofollow" />
  <title>Admin Login</title>
  <link rel="icon" type="image/svg+xml" href="../assets/favicon.svg" />
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            accent: { DEFAULT: '#5865F2', hover: '#4752C4' },
          },
        },
      },
    };
  </script>
  <link rel="stylesheet" href="css/admin.css" />
  <style>
    .login-card {
      animation: fadeIn 0.4s ease-out;
    }
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(8px); }
      to { opacity: 1; transform: translateY(0); }
    }
  </style>
</head>
<body class="min-h-screen flex items-center justify-center bg-gray-50 p-4">
  <div class="w-full max-w-sm login-card">
    <div class="bg-white rounded-xl shadow-lg border border-gray-100 p-8">
      <div class="text-center mb-6">
        <img src="../assets/logo.svg" alt="Logo" class="h-8 mx-auto mb-3" />
        <h1 class="text-xl font-bold text-gray-900">Admin Login</h1>
        <p class="text-sm text-gray-500 mt-1">Enter your password to continue.</p>
      </div>

      <form id="login-form" novalidate>
        <div class="mb-4">
          <label for="password" class="block text-sm font-medium text-gray-700 mb-1.5">Password</label>
          <input
            type="password"
            id="password"
            class="w-full px-4 py-2.5 border border-gray-200 rounded-lg text-sm focus:border-[#5865F2] focus:ring-2 focus:ring-[#5865F2]/20 outline-none transition-all"
            placeholder="Enter admin password"
            required
            autocomplete="current-password"
          />
        </div>

        <div id="error-message" class="hidden mb-4 p-3 bg-red-50 border border-red-200 rounded-lg text-sm text-red-700"></div>

        <button type="submit" id="login-btn" class="w-full py-2.5 bg-[#5865F2] hover:bg-[#4752C4] text-white font-semibold rounded-lg text-sm transition-colors">
          Sign In
        </button>
      </form>
    </div>
  </div>

  <script src="../config.js"></script>
  <script type="module" src="js/login.js"></script>
</body>
</html>
