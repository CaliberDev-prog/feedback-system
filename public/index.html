<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="We value your input. Share your feedback with us." />
  <meta name="robots" content="index, follow" />
  <link rel="icon" type="image/svg+xml" href="assets/favicon.svg" />
  <title>Feedback</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            accent: { DEFAULT: '#5865F2', hover: '#4752C4' },
          },
          fontFamily: {
            sans: ['-apple-system', 'BlinkMacSystemFont', 'Segoe UI', 'Roboto', 'Helvetica Neue', 'Arial', 'sans-serif'],
          },
        },
      },
    };
  </script>
  <link rel="stylesheet" href="css/style.css" />
  <script type="module" src="js/utils.js"></script>
</head>
<body class="min-h-screen flex flex-col">
  <div id="form-container" class="flex-1 flex items-center justify-center px-4 py-8 sm:py-12">
    <div class="w-full max-w-2xl">

      <div id="form-card" class="form-card p-6 sm:p-8 md:p-10">
        <div class="text-center mb-8">
          <img id="form-logo" src="assets/logo.svg" alt="Logo" class="h-10 mx-auto mb-4" />
          <h1 id="form-title" class="text-2xl sm:text-3xl font-bold text-gray-900 tracking-tight">Feedback</h1>
          <p id="form-description" class="mt-2 text-gray-500 text-sm sm:text-base">We value your input.</p>
        </div>

        <form id="feedback-form" novalidate>
          <div id="questions-container"></div>

          <div class="mt-8 pt-6 border-t border-gray-100">
            <button type="submit" id="submit-btn" class="btn-primary w-full sm:w-auto">
              Submit Feedback
            </button>
          </div>
        </form>

        <div id="success-state" class="hidden flex-col items-center justify-center py-12 text-center">
          <svg class="success-checkmark mb-6" viewBox="0 0 72 72" xmlns="http://www.w3.org/2000/svg">
            <circle class="checkmark-circle" cx="36" cy="36" r="30" fill="none" stroke="#10b981" stroke-width="3" />
            <path class="checkmark-path" d="M22 36l10 10 18-18" fill="none" stroke="#10b981" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" />
          </svg>
          <h2 class="text-2xl font-bold text-gray-900 mb-2 animate-fade-up delay-2">Thank You!</h2>
          <p class="text-gray-500 mb-6 animate-fade-up delay-3">Your feedback has been received. We appreciate your input.</p>
          <button onclick="location.reload()" class="btn-secondary animate-fade-up delay-4">
            Submit Another Response
          </button>
        </div>
      </div>

      <p id="form-footer" class="text-center text-xs text-gray-400 mt-6">Powered by Universal Feedback System</p>
    </div>
  </div>

  <script src="config.js"></script>
  <script type="module" src="js/form.js"></script>
</body>
</html>
