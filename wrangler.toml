name = "universal-feedback-system"
main = "worker/index.js"
compatibility_date = "2025-01-01"

[assets]
directory = "./public"
binding = "ASSETS"

[vars]
RATE_LIMIT_MAX = "20"
RATE_LIMIT_WINDOW = "60"
ADMIN_SESSION_TTL = "86400"
CORS_ORIGIN = ""

[[kv_namespaces]]
binding = "FEEDBACK_KV"
id = ""
preview_id = ""

[env.production]
vars = { ENVIRONMENT = "production" }

[env.preview]
vars = { ENVIRONMENT = "preview" }
